name: daily-prices
on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 늦어질 수 있어서 여러 번 돌린다 (정각·15분 단위는 붐벼서 피함)
    - cron: "37 7 * * 1-5"    # 한국 시간 평일 16:37 (한국 장 마감 후)
    - cron: "37 10 * * 1-5"   # 한국 시간 평일 19:37
    - cron: "43 21 * * 0-4"   # 한국 시간 평일 06:43 (미국 장 마감 후)
    - cron: "13 22 * * 0-4"   # 한국 시간 평일 07:13
  workflow_dispatch: {}
  push:
    paths: ["fetch.py", ".github/workflows/prices.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance finance-datareader pandas
      - run: python fetch.py
      - run: |
          git config user.name "aivh-bot"
          git config user.email "aivh-bot@users.noreply.github.com"
          git add data/
          git commit -m "prices $(TZ=Asia/Seoul date +%F_%H%M)" || echo "no change"
          git push
