name: daily-prices
on:
  schedule:
    - cron: "15 21 * * 0-4"   # 한국 시간 평일 06:15 (미국 장 마감 직후)
    - cron: "0 22 * * 0-4"    # 한국 시간 평일 07:00 (한 번 더, 지연 대비)
  workflow_dispatch: {}
  push:
    paths: ["fetch.py", ".github/workflows/prices.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance finance-datareader pandas
      - run: python fetch.py
      - run: |
          git config user.name "aivh-bot"
          git config user.email "aivh-bot@users.noreply.github.com"
          git add data/
          git commit -m "prices $(TZ=Asia/Seoul date +%F_%H%M)" || echo "no change"
          git push
